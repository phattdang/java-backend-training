spring.application.name=P03_JpaRepository
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/p03_jpa_repository_practice
spring.datasource.username=${JPA_REPOSITORY_DB_USERNAME:postgres}
spring.datasource.password=${JPA_REPOSITORY_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
