openapi: 3.0.3
info:
  title: P03 - Spring Data Repository Practice API
  version: 1.0.0
  description: API experiment lab for Part 4 - Spring Data Repository.

servers:
  - url: http://localhost:8084
    description: Local P03 server

tags:
  - name: Repository Concepts
    description: Repository abstraction, interface comparison, and runtime proxies.
  - name: Save Operations
    description: save(), saveAll(), and saveAndFlush().
  - name: Read Operations
    description: findById(), findAll(), existsById(), count(), and Optional.
  - name: Delete Operations
    description: delete(), deleteById(), and deleteAll().
  - name: Flush Operations
    description: Explicit flush behavior.

paths:
  /practice/repositories:
    get:
      tags: [Repository Concepts]
      summary: Compare repository interfaces and inspect Spring runtime proxies
      description: Demonstrates Part 4.1-4.5 and 4.18.
      operationId: compareRepositories
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'

  /practice/users:
    post:
      tags: [Save Operations]
      summary: Create a new user with save()
      description: Demonstrates Part 4.6 for a new entity.
      operationId: createUser
      requestBody:
        $ref: '#/components/requestBodies/CreateUser'
      responses:
        '201':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Read Operations]
      summary: Load all users with findAll()
      description: Demonstrates Part 4.9 without pagination.
      operationId: findAllUsers
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'
    delete:
      tags: [Delete Operations]
      summary: Delete every user with deleteAll()
      description: 'Part 4.14 learning-only endpoint. WARNING: removes every row from the users table.'
      operationId: deleteAllUsers
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'

  /practice/users/batch:
    post:
      tags: [Save Operations]
      summary: Create multiple users with saveAll()
      description: Demonstrates Part 4.7 repository API behavior, not JDBC batching optimization.
      operationId: createUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/CreateUserRequest'
            example:
              - name: Bruno Batch One
                email: bruno.batch.one@example.com
              - name: Bruno Batch Two
                email: bruno.batch.two@example.com
      responses:
        '201':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /practice/users/save-and-flush:
    post:
      tags: [Save Operations, Flush Operations]
      summary: Create a user with saveAndFlush()
      description: Demonstrates Part 4.16. Flush synchronizes SQL but does not commit the transaction.
      operationId: saveAndFlush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              name: Bruno Save And Flush
              email: bruno.save.flush@example.com
      responses:
        '201':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /practice/users/count:
    get:
      tags: [Read Operations]
      summary: Count all users with count()
      description: Demonstrates Part 4.11.
      operationId: countUsers
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'

  /practice/users/entity/{id}:
    delete:
      tags: [Delete Operations]
      summary: Load a user and delete it with delete(entity)
      description: Demonstrates Part 4.12. Create a disposable user before calling this endpoint.
      operationId: deleteUserEntity
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /practice/users/{id}:
    get:
      tags: [Read Operations]
      summary: Find a user with findById() and Optional
      description: Demonstrates Part 4.8 and 4.17 using Optional.orElseThrow().
      operationId: findUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Save Operations]
      summary: Update an existing user with save()
      description: Demonstrates Part 4.6 merge-like behavior for a non-new entity.
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateUser'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Delete Operations]
      summary: Delete a user with deleteById()
      description: Demonstrates Part 4.13. Create a disposable user before calling this endpoint.
      operationId: deleteUserById
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'

  /practice/users/{id}/exists:
    get:
      tags: [Read Operations]
      summary: Check user existence with existsById()
      description: Demonstrates Part 4.10.
      operationId: userExists
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'

  /practice/users/{id}/flush:
    post:
      tags: [Flush Operations]
      summary: Update a managed user and call flush()
      description: Demonstrates Part 4.15. SQL is forced before return while the transaction remains uncommitted.
      operationId: flushUserUpdate
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              name: Bruno Flushed User
              email: bruno.flushed.user@example.com
      responses:
        '200':
          $ref: '#/components/responses/RepositoryOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: ID of an existing user
      schema:
        type: integer
        format: int64
        example: 1

  requestBodies:
    CreateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserRequest'
          example:
            name: Bruno Practice User
            email: bruno.practice.user@example.com
    UpdateUser:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserRequest'
          example:
            name: Bruno Updated User
            email: bruno.updated.user@example.com

  responses:
    RepositoryOperationResponse:
      description: Repository practice operation result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RepositoryOperationResult'
    BadRequest:
      description: Request validation failed
    NotFound:
      description: User was not found

  schemas:
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 100
          example: Bruno Practice User
        email:
          type: string
          format: email
          maxLength: 150
          example: bruno.practice.user@example.com

    UpdateUserRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 100
          example: Bruno Updated User
        email:
          type: string
          format: email
          maxLength: 150
          example: bruno.updated.user@example.com

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Bruno Practice User
        email:
          type: string
          format: email
          example: bruno.practice.user@example.com

    RepositoryOperationResult:
      type: object
      required: [operation, explanation, data]
      properties:
        operation:
          type: string
          example: save() - new entity
        explanation:
          type: string
          example: save() detects a new entity and uses persist-like behavior.
        data:
          description: Result shape depends on the demonstrated repository operation.
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: array
              items:
                $ref: '#/components/schemas/User'
            - type: boolean
            - type: integer
              format: int64
            - type: object
              additionalProperties: true
