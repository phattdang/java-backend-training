openapi: 3.0.3
info:
  title: P09 Final Test Order Inventory API
  version: 0.1.0
  description: Spring Data JPA capstone API for customer, product, and order flows.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot server
tags:
  - name: Customers
  - name: Products
  - name: Orders
paths:
  /customers:
    post:
      tags:
        - Customers
      summary: Create customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
            example:
              fullName: "Nguyen Van A"
              email: "customer1@example.com"
              phone: "0900000001"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "409":
          description: Email already exists
  /customers/{id}:
    get:
      tags:
        - Customers
      summary: Get customer by id
      operationId: getCustomer
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          description: Customer not found
  /products:
    post:
      tags:
        - Products
      summary: Create product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
            example:
              productCode: "PRD-001"
              name: "Keyboard"
              description: "Mechanical keyboard"
              price: 1200000.00
              stock: 10
              status: "ACTIVE"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "409":
          description: Product code already exists
    get:
      tags:
        - Products
      summary: List products with pagination and sorting
      operationId: getProducts
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
        - $ref: "#/components/parameters/SortQuery"
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by id
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
    patch:
      tags:
        - Products
      summary: Update product partially
      operationId: updateProduct
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
            example:
              name: "Keyboard V2"
              description: "Updated mechanical keyboard"
              price: 1350000.00
              stock: 8
              status: "ACTIVE"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
  /orders:
    post:
      tags:
        - Orders
      summary: Create order and decrease product stock in one transaction
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              customerId: 1
              items:
                - productId: 1
                  quantity: 2
                - productId: 2
                  quantity: 1
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Product inactive or not enough stock
        "404":
          description: Customer or product not found
    get:
      tags:
        - Orders
      summary: List order summaries with pagination and sorting
      operationId: getOrders
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
        - $ref: "#/components/parameters/SortQuery"
      responses:
        "200":
          description: Order summary page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"
  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order detail
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order not found
  /orders/{orderId}/items/{itemId}:
    delete:
      tags:
        - Orders
      summary: Remove order item and trigger orphanRemoval
      operationId: removeOrderItem
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Order after item removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          description: Order or order item not found
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    SizeQuery:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      example: 20
    SortQuery:
      name: sort
      in: query
      required: false
      schema:
        type: string
      examples:
        createdAtDesc:
          value: "createdAt,desc"
        idAsc:
          value: "id,asc"
  schemas:
    CustomerStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    ProductStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - OUT_OF_STOCK
    OrderStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
        - COMPLETED
    CreateCustomerRequest:
      type: object
      required:
        - fullName
        - email
      properties:
        fullName:
          type: string
          example: "Nguyen Van A"
        email:
          type: string
          format: email
          example: "customer1@example.com"
        phone:
          type: string
          example: "0900000001"
    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          $ref: "#/components/schemas/CustomerStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required:
        - productCode
        - name
        - price
        - stock
      properties:
        productCode:
          type: string
          example: "PRD-001"
        name:
          type: string
          example: "Keyboard"
        description:
          type: string
          example: "Mechanical keyboard"
        price:
          type: number
          format: double
          minimum: 0
          example: 1200000.00
        stock:
          type: integer
          minimum: 0
          example: 10
        status:
          $ref: "#/components/schemas/ProductStatus"
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          example: "Keyboard V2"
        description:
          type: string
          example: "Updated mechanical keyboard"
        price:
          type: number
          format: double
          minimum: 0
          example: 1350000.00
        stock:
          type: integer
          minimum: 0
          example: 8
        status:
          $ref: "#/components/schemas/ProductStatus"
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productCode:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
        status:
          $ref: "#/components/schemas/ProductStatus"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateOrderItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: integer
          format: int64
          example: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateOrderItemRequest"
    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productCode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        subtotal:
          type: number
          format: double
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderCode:
          type: string
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: number
          format: double
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponse"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderSummaryResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderCode:
          type: string
        customerName:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalAmount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
    PageMetadata:
      type: object
      additionalProperties: true
    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      additionalProperties: true
    OrderSummaryPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummaryResponse"
        page:
          $ref: "#/components/schemas/PageMetadata"
      additionalProperties: true
