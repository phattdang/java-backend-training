spring.application.name=P09_FinalTest
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/p09_finaltest
spring.datasource.username=${NPLUSONE_DB_USERNAME:postgres}
spring.datasource.password=${NPLUSONE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true

# Hibernate 6/7 bind values. TRACE is intentionally verbose for this laboratory.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# No global batch fetch property is enabled here.
# The baseline endpoints must keep showing N+1 clearly.
spring.sql.init.mode=never
