spring.application.name=P06_FetchingLazyEager
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/p06_jpa_fetching_practice
spring.datasource.username=${JPA_FETCHING_DB_USERNAME:postgres}
spring.datasource.password=${JPA_FETCHING_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Required so the detached lazy-access experiment is deterministic.
spring.jpa.open-in-view=false

logging.level.org.hibernate.orm.jdbc.bind=TRACE
