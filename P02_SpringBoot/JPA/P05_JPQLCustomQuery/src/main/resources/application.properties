spring.application.name=P05_JPQLCustomQuery
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/p05_jpa_jpql_practice
spring.datasource.username=${JPA_JPQL_DB_USERNAME:postgres}
spring.datasource.password=${JPA_JPQL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate 7 bind-parameter values, useful when comparing JPQL with generated SQL.
logging.level.org.hibernate.orm.jdbc.bind=TRACE
