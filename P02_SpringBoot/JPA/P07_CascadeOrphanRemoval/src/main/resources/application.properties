spring.application.name=P07_CascadeOrphanRemoval
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/p07_jpa_cascade_practice
spring.datasource.username=${JPA_CASCADE_DB_USERNAME:postgres}
spring.datasource.password=${JPA_CASCADE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate 6/7 bind values. TRACE is intentionally verbose for this laboratory.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Creates only the two isolated database-cascade tables in schema.sql.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
