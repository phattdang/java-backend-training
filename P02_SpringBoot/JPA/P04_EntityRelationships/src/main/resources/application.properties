spring.application.name=P04_EntityRelationships
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/p04_jpa_relationship_practice
spring.datasource.username=${JPA_RELATIONSHIP_DB_USERNAME:postgres}
spring.datasource.password=${JPA_RELATIONSHIP_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
